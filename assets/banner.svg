<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#titleGrad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      
      /* Dynamic Animated Background Elements */
      @keyframes float1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.2; }
        50% { transform: scale(1.05); opacity: 0.4; }
        100% { transform: scale(0.95); opacity: 0.2; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-card-1 { animation: float1 6s ease-in-out infinite; }
      .floating-card-2 { animation: float2 7s ease-in-out infinite; }
      .pulse-circle { transform-origin: 950px 200px; animation: pulseRing 5s ease-in-out infinite; }
      .pulse-line { stroke-dasharray: 10 15; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="396" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Background Dynamic Elements (Behind Text) -->
  <g opacity="0.6">
    <circle cx="950" cy="200" r="130" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="2" class="pulse-circle"/>
    <circle cx="950" cy="200" r="80" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Dynamic Connecting Network Lines -->
    <path d="M 150 80 Q 400 30 950 200" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" class="pulse-line"/>
    <path d="M 100 320 Q 600 370 950 200" fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="2" class="pulse-line"/>
  </g>

  <!-- Dynamic Background Floating Graphic Badges / Micro-cards (Positioned to avoid center text) -->
  <g class="floating-card-1">
    <rect x="70" y="50" width="220" height="45" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="180" y="78" text-anchor="middle" class="badge-text">Zero-Trust PAM</text>
  </g>
  
  <g class="floating-card-2">
    <rect x="910" y="60" width="220" height="45" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3"/>
    <text x="1020" y="88" text-anchor="middle" class="badge-text" fill="#c084fc">Root Account Vault</text>
  </g>

  <g class="floating-card-1">
    <rect x="910" y="300" width="220" height="45" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="1020" y="328" text-anchor="middle" class="badge-text" fill="#818cf8">Just-in-Time Access</text>
  </g>

  <g class="floating-card-2">
    <rect x="70" y="300" width="230" height="45" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="185" y="328" text-anchor="middle" class="badge-text" fill="#34d399">Multi-Cloud Compliance</text>
  </g>

  <!-- Foreground Content Container (Clean & Unobscured) -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 115)" filter="url(#glow)">
      <circle cx="0" cy="0" r="42" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
      <!-- Shield & Key Icon -->
      <path d="M -14 -12 L 0 -20 L 14 -12 V 4 C 14 14 0 22 0 22 C 0 22 -14 14 -14 4 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-2" r="4" fill="#c084fc"/>
      <path d="M 0 2 V 10 M -2 7 H 2" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="215" class="title">Awesome Cloud Root Account Management</text>
    
    <!-- Subtitle -->
    <text x="600" y="260" class="subtitle">Curated Directory of Cloud PAM, Root Account Security &amp; Just-in-Time Access</text>

    <!-- Pill Badges inside Center Frame -->
    <g transform="translate(600, 295)">
      <rect x="-210" y="0" width="130" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="-145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">AWS / Azure / GCP</text>

      <rect x="-65" y="0" width="130" height="28" rx="14" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">Open-Source PAM</text>

      <rect x="80" y="0" width="130" height="28" rx="14" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.4"/>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">Enterprise Vaults</text>
    </g>
  </g>
</svg>
